name: Build and Package

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BUILD_VERSION: 0.0.${{ github.run_number }}

jobs:
  build-linux:
    name: Build Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config rpm

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build binary
        run: cargo build --release

      - name: Create tarball
        run: |
          mkdir -p release
          cp target/release/openixcli release/
          cd release
          tar -czvf openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.tar.gz openixcli
          mv openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.tar.gz ..

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build DEB package
        run: |
          cargo deb
          mv target/debian/openixcli_*.deb openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.deb

      - name: Build RPM package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo generate-rpm
          mv target/generate-rpm/*.rpm openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.BUILD_VERSION }}-${{ matrix.target }}
          path: |
            openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.tar.gz
            openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.deb
            openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.rpm

  build-linux-musl:
    name: Build Linux static ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET_CC: musl-gcc
      TARGET_AR: ar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file linux-libc-dev musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build static binary
        run: |
          TARGET="${{ matrix.target }}"
          target_env=${TARGET^^}
          target_env=${target_env//-/_}
          target_arch=${TARGET%%-*}
          export TARGET_CFLAGS="-include sys/types.h -idirafter /usr/include -idirafter /usr/include/${target_arch}-linux-gnu"
          export "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
          cargo build --release --target "$TARGET"

      - name: Verify static linkage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/openixcli"
          file "$binary"
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "Error: $binary contains a dynamic interpreter"
            exit 1
          fi
          if readelf -d "$binary" 2>&1 | grep -q '(NEEDED)'; then
            echo "Error: $binary contains dynamically linked dependencies"
            exit 1
          fi
          "$binary" --version

      - name: Create tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -C "target/$TARGET/release" -czvf \
            "openixcli-${{ env.BUILD_VERSION }}-$TARGET.tar.gz" openixcli

      - name: Upload static Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.BUILD_VERSION }}-${{ matrix.target }}
          path: openixcli-${{ env.BUILD_VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install libusb
        run: brew install libusb

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run macOS build script
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh ${{ matrix.target }} ${{ env.BUILD_VERSION }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.BUILD_VERSION }}-${{ matrix.target }}
          path: |
            openixcli-v*-${{ matrix.target }}.tar.gz
            openixcli-v*-${{ matrix.target }}.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install libusb
        run: |
          vcpkg install libusb:${{ matrix.vcpkg_triplet }}
          vcpkg integrate install

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install packaging tools
        run: |
          dotnet tool install --global wix --version 4.0.4
          choco install nsis -y

      - name: Run Windows build script
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          ./scripts/build-windows.ps1 ${{ matrix.target }} ${{ env.BUILD_VERSION }}
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.BUILD_VERSION }}-${{ matrix.target }}
          path: |
            openixcli-v*-${{ matrix.target }}.zip
            openixcli-v*-${{ matrix.target }}.msi
            openixcli-v*-${{ matrix.target }}-setup.exe
